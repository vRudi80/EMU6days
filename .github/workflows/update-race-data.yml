name: Update race data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-race-data.yml"
  schedule:
    # Run every 5 minutes, offset from exact 5-minute boundaries.
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

# Never allow two race scrapes to run at the same time.
# A newer 5-minute trigger cancels an older stuck run.
concurrency:
  group: emu6days-race-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Discover athletes once per discovery version
        if: ${{ !hashFiles('data/discovery.version') }}
        run: |
          python scripts/discover.py
          echo "2" > data/discovery.version

      - name: Scrape known athletes
        run: python scripts/scrape.py
        timeout-minutes: 7

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race.json data/athletes.json data/discovery.version
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update race data"
            git push
          fi
