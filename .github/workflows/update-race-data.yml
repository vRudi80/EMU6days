name: Update race data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-race-data.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Discover athletes once
        if: ${{ !hashFiles('data/athletes.json') }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/discover.py

      - name: Scrape known athletes
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race.json data/athletes.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update race data"
            git push
          fi
