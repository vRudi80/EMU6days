<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMU 6-Day Race – Live Race Analyzer</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fa;
      color: #18212f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .notice {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid #e2e7ee;
      border-radius: 22px;
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      box-shadow: 0 18px 50px rgba(24, 33, 47, .08);
    }
    .icon { font-size: 48px; margin-bottom: 22px; }
    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #667085;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
    }
    p {
      margin: 0 auto;
      max-width: 590px;
      font-size: 18px;
      line-height: 1.65;
      color: #475467;
    }
    .thanks {
      margin-top: 22px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="notice">
    <div class="icon">🏃</div>
    <div class="eyebrow">XV. EMU 6-Day Race / GOMU 6-Day World Championship</div>
    <h1>A live eredménykövető oldal leállítva</h1>
    <p>
      A Köridő.hu üzemeltetőjével történt egyeztetés alapján a live eredménykövető
      oldalt és az automatikus adatlekérdezéseket leállítottuk.
    </p>
    <p class="thanks">
      Köszönjük a megértést, és sok sikert kívánunk minden versenyzőnek!
    </p>
  </main>
</body>
</html>
